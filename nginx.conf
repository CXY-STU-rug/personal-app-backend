# ============================================================
# 前端站点 + 后端反代的 nginx 配置
#
# 用法：挂载进 nginx:alpine 容器的 /etc/nginx/conf.d/default.conf
#   docker run -v /宿主机路径/nginx.conf:/etc/nginx/conf.d/default.conf:ro ...
#
# ⚠️ 这个文件为什么要进版本控制：
#   它原来只存在于服务器的 /root/personaluse-web/nginx.conf，从未入库。
#   服务器实例被释放后，整套部署里唯一无法自动恢复的就是它——
#   Dockerfile、docker-compose.yml、init.sql、application.yml 都在 git 里，
#   clone 下来就能重建，只有这个文件得靠回忆重写。
#
# ⚠️ 改这个文件的坑（实测踩过）：
#   容器是用【单文件】bind mount 挂载的，绑定的是文件的 inode。
#   sed -i 不是原地修改，它写新文件再替换文件名，会产生新 inode，
#   于是宿主机文件变了、容器里读到的还是旧内容。
#   更麻烦的是 `docker exec xxx nginx -t` 校验的正是容器里那份旧文件，
#   所以它会"语法通过"，给出虚假的成功信号。
#   正确改法二选一：
#     ① 改到临时文件后用 `cat 临时文件 > nginx.conf` 原地覆盖（保留 inode），再 nginx -s reload
#     ② 或者改完直接 docker restart 容器（重新解析挂载路径）
# ============================================================

server {
    listen 80;
    server_name _;                     # 通配，用 IP 直接访问也能命中

    # ===== 上传体积上限 =====
    # nginx 不配这项时默认只有 1MB。手机照片普遍 2~5MB、短视频 30~60MB，
    # 全都会在 nginx 这一层就被拒，请求根本到不了后端。
    # 而且 nginx 返回的是 HTML 错误页而不是 JSON，前端 axios 按 JSON 解析失败后
    # 只能显示"网络异常"，让人误以为是后端崩了——这个 bug 实际发生过。
    #
    # 三层限制必须【外宽内严】，业务校验才有机会给出友好的 JSON 提示：
    #   这里 110m  >  application.yml 的 100MB  >  MinioService(图片5MB/视频100MB)
    # 取 110m 而不是 100m：multipart 表单编码有边界字段开销，请求体比文件本身略大。
    client_max_body_size 110m;

    # ===== 读取请求体的超时 =====
    # 默认只有 60s，指的是"两次成功读取之间的间隔"上限，但慢网络下传大文件很容易触发。
    # 实测：40MB 视频在跨境链路要 18 秒，105MB 传了 84 秒后被 nginx 直接 408 掐断
    # （nginx access log 里是 "POST /api/upload/video" 408），
    # 表现和"文件太大被拒"完全不同却同样失败，很难排查。
    # 放到 300s，覆盖慢网络传 100MB 视频的场景。
    client_body_timeout 300s;

    root /usr/share/nginx/html;        # dist 挂载到这里
    index index.html;

    # gzip：js 打包后 1MB+，开压缩明显减小传输体积
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ===== SPA 前端路由 =====
    # Vue Router 是 history 模式，刷新 /todo 这类路径时服务器上没有对应文件，
    # 必须回退到 index.html 交给前端路由处理，否则刷新就 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 静态资源强缓存 =====
    # dist/assets 下的文件名带 hash，内容变了文件名就变，可放心长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 反代后端 API =====
    # host.docker.internal 由 compose 的 extra_hosts 映射到宿主机网关（host-gateway），
    # 指向宿主机上后端 compose 暴露的 9003 端口（容器内 Spring 8080）。
    # 走 docker 内网到宿主机，不经公网，省一圈流量。
    # proxy_pass 结尾不带路径 → 原样保留 /api/xxx 前缀转发（后端接口就是 /api/...）。
    location /api/ {
        proxy_pass http://host.docker.internal:9003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;        # AI 接口可能响应较慢，放宽超时
    }

    # ===== 反代 OAuth 端点 =====
    # ⭐ 这一段原来是缺的，导致 GitHub 登录从前端根本走不通。
    # 原因：SecurityConfig 把 oauth2Login 的两个 baseUri 自定义到了 /auth/ 下——
    #   .authorizationEndpoint(a -> a.baseUri("/auth/oauth2/authorization"))
    #   .redirectionEndpoint(r -> r.baseUri("/auth/login/oauth2/code/*"))
    # 而这里只反代了 /api/，于是 /auth/... 落到上面的 location / 走 SPA 回退，
    # 返回 index.html（HTTP 200 的 HTML）而不是 302 跳转，登录流程直接断在第一步。
    # 直连 9003 打同一个路径是正常 302，这个对比可以确认问题在反代不在后端。
    #
    # 注意 location 的匹配规则：前缀匹配里【最长的前缀优先】，
    # 所以 /auth/ 会稳定赢过 /，不用担心被 SPA 回退抢走。
    location /auth/ {
        proxy_pass http://host.docker.internal:9003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 反代 /login =====
    # OauthController 的 @RequestMapping("/login") + @PutMapping 提供了第二个登录入口。
    # 不反代的话，PUT /login 会落到 location / 的静态文件处理，
    # 而静态文件 location 不接受 PUT 方法 → nginx 直接返回 405 Not Allowed。
    # 该接口与 POST /api/user/login 功能重复（都是账密换 JWT），
    # 前端若只用后者，这段可以删掉。
    location /login {
        proxy_pass http://host.docker.internal:9003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
